# Fly.io — BusinessOS / Project Z
# Region: sin (Singapore) — closest available to India; bom is unavailable for new apps.

app = "econsole"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  HOSTNAME = "0.0.0.0"
  NODE_ENV = "production"
  PORT = "3000"
  DATABASE_URL = "file:/data/prod.db"

# Create once: fly volumes create data --region sin --size 5 -a econsole
[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    grace_period = "60s"
    interval = "15s"
    method = "GET"
    path = "/api/v1/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
