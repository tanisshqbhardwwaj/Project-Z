[package]
name = "project-z-desktop"
version = "0.1.0"
description = "BusinessOS by E-console — shop desktop shell"
authors = ["E-console"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs-next = "2"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
] }

[lib]
name = "project_z_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
