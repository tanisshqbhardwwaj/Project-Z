[package]
name = "project-z-desktop"
version = "0.1.0"
description = "Project Z shop desktop shell"
authors = ["Project Z"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "project_z_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
