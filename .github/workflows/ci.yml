name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DATABASE_URL: file:./dev.db
  AUTH_SECRET: ci-test-secret-32-characters-long
  AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  AI_PROVIDER: manual
  RESEND_API_KEY: re_ci_test_key
  EMAIL_FROM: Project Z <test@example.com>
  S3_ENDPOINT: http://localhost:9000
  S3_REGION: auto
  S3_ACCESS_KEY_ID: ci-access-key
  S3_SECRET_ACCESS_KEY: ci-secret-key
  S3_BUCKET: project-z

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test
      - run: npm run build:local
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  vercel-env-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject missing Turso credentials on Vercel builds
        run: |
          node --input-type=module -e "
          import { validateProductionEnv } from './scripts/validate-production-env.mjs';
          const errors = validateProductionEnv({
            DATABASE_URL: 'postgresql://u:p@localhost:5433/db',
            TURSO_DATABASE_URL: '',
            TURSO_AUTH_TOKEN: '',
            AUTH_SECRET: 'short',
            AUTH_URL: 'http://localhost:3000',
            NEXT_PUBLIC_APP_URL: 'http://localhost:3000',
            RESEND_API_KEY: '',
            EMAIL_FROM: '',
            S3_ENDPOINT: 'http://localhost:9000',
            S3_ACCESS_KEY_ID: 'minioadmin',
            S3_SECRET_ACCESS_KEY: 'minioadmin',
            S3_BUCKET: '',
          });
          if (errors.length < 5) throw new Error('Expected validation to catch bad env');
          console.log('✓ Vercel env guard catches misconfiguration');
          "
      - name: Accept valid production env
        run: |
          node --input-type=module -e "
          import { validateProductionEnv } from './scripts/validate-production-env.mjs';
          const errors = validateProductionEnv({
            TURSO_DATABASE_URL: 'libsql://project-z-user.turso.io',
            TURSO_AUTH_TOKEN: 'eyJhbGci.test',
            AUTH_SECRET: 'ci-test-secret-32-characters-long',
            AUTH_URL: 'https://project-z.vercel.app',
            NEXT_PUBLIC_APP_URL: 'https://project-z.vercel.app',
            RESEND_API_KEY: 're_real_key_123',
            EMAIL_FROM: 'Project Z <onboarding@resend.dev>',
            S3_ENDPOINT: 'https://abc123.r2.cloudflarestorage.com',
            S3_ACCESS_KEY_ID: 'real-access-key',
            S3_SECRET_ACCESS_KEY: 'real-secret-key',
            S3_BUCKET: 'project-z',
          });
          if (errors.length > 0) throw new Error(errors.join('; '));
          console.log('✓ Valid production env passes');
          "
